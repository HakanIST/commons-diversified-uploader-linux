name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test core -c Release
      - name: Recognition pipeline on a sample image
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p build/sample
          convert -size 1500x1000 xc:"#1f2978" -gravity center -pointsize 380 -fill "#fcdb33" -annotate 0 "23" build/sample/sample.jpg
          dotnet run -c Release --project core/src/UploaderCli -- analyze "$HOME/model" build/sample/sample.jpg | tee build/sample/result.txt
          grep -q " 23\[" build/sample/result.txt
      - name: Version
        id: version
        run: |
          case "$GITHUB_REF" in refs/tags/v*) echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;; *) echo "value=0.1.0" >> "$GITHUB_OUTPUT" ;; esac
      - run: packaging/build-deb.sh ${{ matrix.arch }} ${{ steps.version.outputs.value }}
      - name: Install the package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./build/*.deb xvfb dbus imagemagick adwaita-icon-theme fonts-cantarell
      - name: Screenshots
        run: packaging/screenshots.sh /opt/commons-diversified-uploader build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: commons-diversified-uploader-${{ matrix.arch }}-deb
          path: build/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.arch }}
          path: build/screenshots
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: commons-diversified-uploader-*-deb
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
